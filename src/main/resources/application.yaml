spring:
  application:
    name: Gudit

  datasource:
    url: jdbc:postgresql://localhost:5432/gudit
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234

  
  data:
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize # 인가페이지
            token-uri: https://kauth.kakao.com/oauth/token # 코드 -> 토큰 교환
            user-info-uri: https://kapi.kakao.com/v2/user/me # 사용자 정보 조회
            user-name-attribute: id

  jpa:
    hibernate:
      ddl-auto: update


jwt:
  issuer: test@naver.com
  secret_key: ${JWT_SECRET_KEY}
  access-token-validity: 2h
  refresh-token-validity: 7d

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}

springdoc:
  show-actuator: true