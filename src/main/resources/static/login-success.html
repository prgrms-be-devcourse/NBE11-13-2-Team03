<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 성공</title>
</head>

<body>

<h1>로그인 성공!</h1>

<p>카카오 로그인이 정상적으로 완료되었습니다.</p>

<button type="button" onclick="logout()">
    로그아웃
</button>

<script>
    async function logout() {
        const response = await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include"
        });

        if (response.ok) {
            alert("로그아웃 되었습니다.");
            location.href = "/";
        } else {
            alert("로그아웃에 실패했습니다.");
        }
    }
</script>

</body>
</html>
