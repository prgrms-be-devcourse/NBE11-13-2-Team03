<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 | GUDIT</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main payment-result-page">

    <section class="payment-result-card">

        <div class="payment-result-icon success">
            ✓
        </div>

        <span class="page-eyebrow">
            PAYMENT COMPLETE
        </span>

        <h1>
            결제가 완료되었습니다
        </h1>

        <p class="payment-result-description">
            개발자 키링 구매가 정상적으로 완료되었습니다.
        </p>

        <div class="payment-result-info">

            <div class="payment-result-row">
                <span>상품명</span>
                <strong>개발자 키링</strong>
            </div>

            <div class="payment-result-row">
                <span>구매 수량</span>
                <strong>1개</strong>
            </div>

            <div class="payment-result-row">
                <span>결제 금액</span>
                <strong>15,000원</strong>
            </div>

            <div class="payment-result-row">
                <span>결제 상태</span>
                <strong class="payment-success-text">
                    결제 완료
                </strong>
            </div>

        </div>

        <div class="payment-result-actions">

            <a href="/mypage/purchases"
               class="secondary-button payment-result-secondary">
                구매 내역 보기
            </a>

            <a href="/sales"
               class="primary-button payment-result-primary">
                굿즈 더 보기
            </a>

        </div>

    </section>

</main>

</body>
</html>
