<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 | GUDIT</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main payment-result-page">

    <section class="payment-result-card">

        <div class="payment-result-icon fail">
            ×
        </div>

        <span class="page-eyebrow payment-fail-eyebrow">
            PAYMENT FAILED
        </span>

        <h1>
            결제에 실패했습니다
        </h1>

        <p class="payment-result-description">
            결제 처리 중 문제가 발생했습니다.<br>
            잠시 후 다시 시도해 주세요.
        </p>

        <div class="payment-result-info">

            <div class="payment-result-row">
                <span>상품명</span>
                <strong>개발자 키링</strong>
            </div>

            <div class="payment-result-row">
                <span>구매 수량</span>
                <strong>1개</strong>
            </div>

            <div class="payment-result-row">
                <span>결제 금액</span>
                <strong>15,000원</strong>
            </div>

            <div class="payment-result-row">
                <span>결제 상태</span>
                <strong class="payment-fail-text">
                    결제 실패
                </strong>
            </div>

        </div>

        <div class="payment-result-actions">

            <a href="/sales/1"
               class="secondary-button payment-result-secondary">
                상품으로 돌아가기
            </a>

            <a href="/payments"
               class="primary-button payment-result-primary">
                다시 결제하기
            </a>

        </div>

    </section>

</main>

</body>
</html>
