<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 관리 | Gudit</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main admin-page">

    <a href="/admin/sales" class="back-link">
        ← 판매 관리로 돌아가기
    </a>

    <section class="admin-form-header">
        <span class="page-eyebrow">ADMIN</span>

        <h1 id="sale-form-title">
            판매 등록
        </h1>

        <p id="sale-form-description">
            판매할 굿즈와 수량, 판매 기간을 설정합니다.
        </p>
    </section>

    <section class="admin-form-card">

        <form id="sale-form" class="admin-form">

            <div class="form-group">
                <label for="goods-id">
                    판매 상품
                    <span class="required">*</span>
                </label>

                <select
                        id="goods-id"
                        required>
                    <option value="" selected disabled>
                        판매할 상품을 선택하세요
                    </option>
                </select>

                <p id="goods-help" class="form-help">
                    판매 가능한 상태의 상품만 선택할 수 있습니다.
                </p>
            </div>

            <div class="form-group">
                <label for="goods-price">
                    상품 가격
                </label>

                <div class="input-with-unit">
                    <input
                            type="text"
                            id="goods-price"
                            value="-"
                            readonly>

                    <span>원</span>
                </div>

                <p class="form-help">
                    선택한 상품에 등록된 가격이 적용됩니다.
                </p>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="initial-stock">
                        초기 수량
                        <span class="required">*</span>
                    </label>

                    <div class="input-with-unit">
                        <input
                                type="number"
                                id="initial-stock"
                                min="1"
                                placeholder="100"
                                required>

                        <span>개</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="max-purchase-quantity">
                        1인 최대 구매 수량
                        <span class="required">*</span>
                    </label>

                    <div class="input-with-unit">
                        <input
                                type="number"
                                id="max-purchase-quantity"
                                min="1"
                                value="1"
                                required>

                        <span>개</span>
                    </div>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="start-at">
                        판매 시작 일시
                        <span class="required">*</span>
                    </label>

                    <input
                            type="datetime-local"
                            id="start-at"
                            required>
                </div>

                <div class="form-group">
                    <label for="end-at">
                        판매 종료 일시
                        <span class="required">*</span>
                    </label>

                    <input
                            type="datetime-local"
                            id="end-at"
                            required>
                </div>

            </div>

            <div class="sale-form-notice">
                판매 시작 시각 이전에는 <strong>판매 예정</strong> 상태로 표시되고,
                판매가 시작되면 구매 요청을 받을 수 있습니다.
                설정한 수량이 모두 소진되면 <strong>품절</strong> 상태가 됩니다.
            </div>

            <p
                    id="sale-form-message"
                    class="form-help">
            </p>

            <div class="admin-form-actions">

                <a
                        href="/admin/sales"
                        class="secondary-button">
                    취소
                </a>

                <button
                        id="sale-submit-button"
                        type="submit"
                        class="primary-button form-submit-button">
                    판매 등록
                </button>

            </div>

        </form>

    </section>

</main>

<script src="/js/admin/sale-form.js"></script>

</body>
</html>
