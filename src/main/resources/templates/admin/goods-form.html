<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 등록 | Gudit</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main admin-page">

    <a href="/admin/goods" class="back-link">
        ← 상품 관리로 돌아가기
    </a>

    <section class="admin-form-header">
        <span class="page-eyebrow">ADMIN</span>
        <h1>상품 등록</h1>
        <p>판매에 사용할 굿즈의 기본 정보를 입력합니다.</p>
    </section>

    <section class="admin-form-card">

        <form class="admin-form">

            <div class="form-group">
                <label for="goodsName">
                    상품명
                    <span class="required">*</span>
                </label>

                <input
                        type="text"
                        id="goodsName"
                        name="goodsName"
                        placeholder="예: 개발자 키링"
                        required>
            </div>

            <div class="form-group">
                <label for="price">
                    가격
                    <span class="required">*</span>
                </label>

                <div class="input-with-unit">
                    <input
                            type="number"
                            id="price"
                            name="price"
                            min="0"
                            placeholder="15000"
                            required>

                    <span>원</span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">
                    상품 설명
                </label>

                <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="상품에 대한 간단한 설명을 입력하세요."></textarea>
            </div>

            <div class="form-group">
                <label for="imageUrl">
                    이미지 URL
                </label>

                <input
                        type="url"
                        id="imageUrl"
                        name="imageUrl"
                        placeholder="https://example.com/image.png">

                <p class="form-help">
                    이미지가 없으면 기본 상품 이미지가 표시됩니다.
                </p>
            </div>

            <div class="form-group">
                <label for="status">
                    상품 상태
                    <span class="required">*</span>
                </label>

                <select id="status"
                        name="status">
                    <option value="ACTIVE" selected>
                        판매 가능
                    </option>
                    <option value="INACTIVE">
                        판매 중지
                    </option>
                </select>

                <p class="form-help">
                    판매 중지된 상품은 사용자 판매 화면에 노출되지 않습니다.
                </p>
            </div>

            <div class="admin-form-actions">
                <a href="/admin/goods"
                   class="secondary-button">
                    취소
                </a>

                <button type="submit"
                        class="primary-button form-submit-button">
                    상품 등록
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
