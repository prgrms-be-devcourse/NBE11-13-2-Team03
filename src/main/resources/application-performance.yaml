spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/gudit
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 7002
      database: 0

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret-key: ${PERFORMANCE_JWT_SECRET_KEY}

gudit:
  inventory:
    # redis: Redis Lua 원자 연산(기본값), db-pessimistic: DB SELECT FOR UPDATE
    mode: ${GUDIT_INVENTORY_MODE:redis}
